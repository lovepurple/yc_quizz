<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次登录修改密码 · 育才实验学校</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 0 0,#e6e0ff,transparent 38%),radial-gradient(circle at 100% 100%,#e4f5ef,transparent 30%),#f7f8fc;font-family:Arial,"Microsoft YaHei",sans-serif;color:#202747}.panel{width:min(480px,100%);background:#fff;border:1px solid #e7e3f5;border-radius:22px;padding:34px;box-shadow:0 18px 60px #34276d16}.brand{color:#6349d3;font-weight:800;font-size:13px;letter-spacing:.08em}.panel h1{font-size:25px;margin:10px 0}.desc{color:#6c7288;line-height:1.7;font-size:14px}.field{display:block;margin:18px 0 0;font-size:13px;font-weight:700}.field input{display:block;width:100%;margin-top:7px;border:1px solid #d9d8e9;border-radius:11px;padding:12px;font-size:16px;outline:none}.field input:focus{border-color:#7659ed;box-shadow:0 0 0 3px #e7e1ff}.rules{background:#f7f5ff;border-radius:10px;padding:11px 13px;color:#6655a6;font-size:12px;margin:16px 0}.btn{width:100%;border:0;border-radius:11px;background:linear-gradient(110deg,#7960ed,#5b43d5);color:white;padding:13px;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55}.msg{min-height:22px;margin:12px 0 0;font-size:13px;color:#b23c39}.msg.ok{color:#148354}.user{font-weight:700;color:#3c3280}
</style></head><body><main class="panel"><div class="brand">育才实验学校 · 校园测评中心</div><h1>首次登录，请设置新密码</h1><p class="desc">欢迎使用教师账号 <span class="user" id="username">教师</span>。为保护账号安全，首次登录必须修改初始密码后才能进入教师管理中心。</p><form id="form"><label class="field">新密码<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="请输入至少8位新密码"></label><label class="field">确认新密码<input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="请再次输入新密码"></label><div class="rules">密码长度为8—128位。请勿使用容易猜到的生日、手机号或统一简单密码。</div><button class="btn" id="submit" type="submit">保存新密码并进入系统</button><p class="msg" id="msg" role="status"></p></form></main><script>
(async()=>{const $=id=>document.getElementById(id),msg=$('msg');try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!d.authenticated||!d.user){location.replace('/');return;}if(d.user.role!=='teacher'||!d.user.mustChangePassword){location.replace('/');return;}$('username').textContent=d.user.username||'教师';}catch{msg.textContent='无法确认登录状态，请刷新页面或重新登录。';}
$('form').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value,c=$('confirm').value;if(p.length<8||p.length>128){msg.textContent='新密码必须为8至128位';return;}if(p!==c){msg.textContent='两次输入的密码不一致';return;}$('submit').disabled=true;msg.textContent='正在保存…';try{const r=await fetch('/api/teacher-account/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'修改失败');msg.className='msg ok';msg.textContent='密码修改成功，正在进入教师管理中心…';setTimeout(()=>location.replace('/'),700);}catch(err){msg.className='msg';msg.textContent=err.message;$('submit').disabled=false;}});
})();
</script></body></html>
